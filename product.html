<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>تفاصيل المنتج | متجر سيرو</title>

    <meta
        name="description"
        content="تفاصيل المنتج في متجر سيرو">

    <link
        rel="stylesheet"
        href="./style/stylesheet.css">

    <script
        src="./style/script.js"
        defer>
    </script>

</head>


<body>

    <!-- ===== الشريط العلوي ===== -->

    <header>

        <div class="navbar">

            <a
                href="index.html"
                class="logo">

                سيرو<span>.</span>

            </a>


            <nav>

                <a href="index.html#home">
                    الرئيسية
                </a>

                <a href="index.html#products">
                    المنتجات
                </a>

                <a href="index.html#features">
                    مميزاتنا
                </a>

                <a href="index.html#contact">
                    تواصل معنا
                </a>

            </nav>


            <button
                class="cart-button"
                onclick="showCart()">

                🛒 السلة

                <span id="cartCount">
                    0
                </span>

            </button>

        </div>

    </header>


    <!-- ===== تفاصيل المنتج ===== -->

    <main>

        <section class="product-details">

            <div class="product-details-image">

                <div id="productImage">
                    🛍️
                </div>

            </div>


            <div class="product-details-info">

                <span class="product-category">
                    متجر سيرو
                </span>


                <h1 id="productName">
                    جاري تحميل المنتج...
                </h1>


                <div
                    class="product-price"
                    id="productPrice">
                    0 ريال
                </div>


                <p
                    class="product-description"
                    id="productDescription">
                    جاري تحميل تفاصيل المنتج...
                </p>


                <h3>
                    المواصفات
                </h3>


                <ul
                    class="product-specifications"
                    id="productSpecifications">

                </ul>


         <div class="product-actions">

    <div class="quantity-selector">

        <button
            type="button"
            id="decreaseQuantity">
            −
        </button>

        <span id="productQuantity">
            1
        </span>

        <button
            type="button"
            id="increaseQuantity">
            +
        </button>

    </div>


    <button
        class="order-button"
        id="addProductButton">

        🛒 أضف إلى السلة

    </button>


    <a
        href="https://wa.me/qr/YDFGDYJZYL34H1"
        target="_blank"
        class="secondary-button">

        💬 استفسر عبر واتساب

    </a>

</div>

            </div>

        </section>

    </main>


    <!-- ===== السلة ===== -->

    <div
        class="cart-overlay"
        id="cartOverlay"
        onclick="closeCart()">
    </div>


    <aside
        class="cart-sidebar"
        id="cartSidebar"
        aria-label="سلة التسوق">

        <div class="cart-header">

            <h2>
                سلة التسوق
            </h2>

            <button
                class="close-cart"
                onclick="closeCart()"
                aria-label="إغلاق السلة">

                ×

            </button>

        </div>


        <div
            class="cart-items"
            id="cartItems">

            <div class="empty-cart">
                السلة فارغة حاليًا 🛒
            </div>

        </div>


        <div class="cart-footer">

            <div class="cart-total">

                <span>
                    الإجمالي:
                </span>

                <span id="cartTotal">
                    0 ريال
                </span>

            </div>


            <button
                class="whatsapp-order"
                onclick="sendOrderToWhatsApp()">

                إرسال الطلب عبر واتساب

            </button>

        </div>

    </aside>


</body>

</html>
